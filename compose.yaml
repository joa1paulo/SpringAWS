services:
  banco:
    image: postgres:16
    container_name: springaws-db
    environment:
      POSTGRES_DB: springaws
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente ou no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - springaws-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d springaws"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rede-app

  app:
    build: .
    container_name: springaws-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/springaws
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente ou no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou no arquivo .env}
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - rede-app

volumes:
  springaws-dados:

networks:
  rede-app:
    driver: bridge