spring.application.name=SpringAWS

spring.datasource.url=jdbc:postgresql://localhost:5432/springaws
spring.datasource.username=app
spring.datasource.password=${DB_PASSWORD:segredo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-1234567890}
jwt.expiration-minutes=60
